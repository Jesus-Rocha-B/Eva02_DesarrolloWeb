<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Presentaciones · Farmacia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="d-flex">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="flex-grow-1 p-5">

        <h1 class="fw-bold text-success-emphasis">Presentaciones de medicamentos</h1>
        <p class="text-muted mb-4">Gestiona las formas farmacéuticas (tabletas, jarabes, inyectables, pomadas).</p>

        <div class="card mb-4 border-0 shadow-sm">
            <div class="card-body">
                <form th:action="@{/web/presentaciones}" th:object="${nuevaPresentacion}" method="post" class="row g-3 align-items-end">
                    <div class="col-md-5">
                        <label class="form-label">Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Jarabe 120ml, Tableta 500mg" required>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">Descripción</label>
                        <input type="text" th:field="*{descripcion}" class="form-control" placeholder="Vía de administración o formato">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-success w-100">Registrar</button>
                    </div>
                </form>
            </div>
        </div>

        <table class="table table-hover bg-white rounded shadow-sm overflow-hidden align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Estado</th>
                <th>Acción</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pres : ${presentaciones}">
                <td th:text="${pres.id}"></td>
                <td class="fw-semibold" th:text="${pres.nombre}"></td>
                <td th:text="${pres.descripcion}"></td>
                <td>
                    <span class="badge rounded-pill"
                          th:classappend="${pres.estado == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'"
                          th:text="${pres.estado}">
                    </span>
                </td>
                <td>
                    <form th:action="@{/web/presentaciones/{id}/cambiar-estado(id=${pres.id})}" method="post" style="display:inline;">
                        <button type="submit"
                                class="btn btn-sm"
                                th:classappend="${pres.estado == 'ACTIVO'} ? 'btn-outline-danger' : 'btn-outline-success'"
                                th:text="${pres.estado == 'ACTIVO' ? 'Desactivar' : 'Activar'}">
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

    </main>

</div>

</body>
</html>
