<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medicamentos · Farmacia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="d-flex">

    <!-- Barra lateral compartida del módulo -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="flex-grow-1 p-5">

        <h1 class="fw-bold text-success-emphasis">Catálogo de medicamentos</h1>
        <p class="text-muted mb-4">Administra los productos farmacéuticos y sus relaciones terapéuticas.</p>

        <!-- Formulario de Registro Estilizado -->
        <div class="card mb-4 border-0 shadow-sm">
            <div class="card-body">
                <form th:action="@{/web/medicamentos/guardar}" th:object="${nuevoMedicamento}" method="post" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Código</label>
                        <input type="text" th:field="*{codigo}" class="form-control" placeholder="Ej: MED-002" required>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">Nombre Comercial</label>
                        <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Ibuprofeno 400mg" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Categoría</label>
                        <select th:field="*{categoria.id}" class="form-select" required>
                            <option value="">Seleccione categoría...</option>
                            <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Laboratorio</label>
                        <select th:field="*{laboratorio.id}" class="form-select" required>
                            <option value="">Seleccione laboratorio...</option>
                            <option th:each="lab : ${laboratorios}" th:value="${lab.id}" th:text="${lab.nombre}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Presentación</label>
                        <select th:field="*{presentacion.id}" class="form-select" required>
                            <option value="">Seleccione presentación...</option>
                            <option th:each="pres : ${presentaciones}" th:value="${pres.id}" th:text="${pres.nombre}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Principio Activo</label>
                        <select th:field="*{principioActivo.id}" class="form-select" required>
                            <option value="">Seleccione principio activo...</option>
                            <option th:each="pa : ${principiosActivos}" th:value="${pa.id}" th:text="${pa.nombre}"></option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Descripción</label>
                        <input type="text" th:field="*{descripcion}" class="form-control" placeholder="Indicaciones de uso o contraindicaciones">
                    </div>
                    <div class="col-md-3 d-flex align-items-center mt-4 pt-2">
                        <div class="form-check">
                            <input type="checkbox" th:field="*{requiereReceta}" class="form-check-input" id="recetaCheck">
                            <label class="form-check-label" for="recetaCheck">Requiere Receta Médica</label>
                        </div>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Registrar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla con estilos integrados y badges idénticos -->
        <table class="table table-hover bg-white rounded shadow-sm overflow-hidden align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Código</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Laboratorio</th>
                <th>Presentación</th>
                <th>Principio Activo</th>
                <!-- [CAMBIO 1] Cabecera agregada -->
                <th>Stock Total</th>
                <th>Receta</th>
                <th>Estado</th>
                <th>Acción</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="med : ${medicamentos}">
                <td th:text="${med.id}"></td>
                <td th:text="${med.codigo}"></td>
                <td class="fw-semibold" th:text="${med.nombre}"></td>
                <td th:text="${med.categoria != null ? med.categoria.nombre : '-'}"></td>
                <td th:text="${med.laboratorio != null ? med.laboratorio.nombre : '-'}"></td>
                <td th:text="${med.presentacion != null ? med.presentacion.nombre : '-'}"></td>
                <td th:text="${med.principioActivo != null ? med.principioActivo.nombre : '-'}"></td>

                <!-- [CAMBIO 2] Celda con cálculo de stock acumulado desde stockMap -->
                <td>
                    <span th:with="cant=${stockMap.get(med.id)}"
                          class="badge rounded-pill"
                          th:classappend="${cant != null and cant > 0} ? 'bg-primary' : 'bg-danger'"
                          th:text="${cant != null and cant > 0} ? ${cant} + ' uds' : 'Sin stock'">
                    </span>
                </td>

                <td>
                    <span class="badge rounded-pill"
                          th:classappend="${med.requiereReceta} ? 'bg-warning text-dark' : 'bg-light text-secondary border'"
                          th:text="${med.requiereReceta ? 'Receta' : 'Libre'}">
                    </span>
                </td>
                <td>
                    <span class="badge rounded-pill"
                          th:classappend="${med.estado == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'"
                          th:text="${med.estado}">
                    </span>
                </td>
                <td>
                    <form th:action="@{/web/medicamentos/{id}/cambiar-estado(id=${med.id})}" method="post" style="display:inline;">
                        <button type="submit"
                                class="btn btn-sm"
                                th:classappend="${med.estado == 'ACTIVO'} ? 'btn-outline-danger' : 'btn-outline-success'"
                                th:text="${med.estado == 'ACTIVO' ? 'Desactivar' : 'Activar'}">
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

    </main>

</div>

</body>
</html>
