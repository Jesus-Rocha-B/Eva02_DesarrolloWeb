<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión · Sistema Clínico & Farmacia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #198754 0%, #0d5432 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            border-radius: 1rem;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body>

<div class="container p-3">
    <div class="card login-card mx-auto border-0 bg-white p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-success text-white rounded-circle mb-3" style="width: 64px; height: 64px;">
                <i class="bi bi-hospital fs-2"></i>
            </div>
            <h2 class="fw-bold text-success-emphasis">Portal Clínico</h2>
            <p class="text-muted small">Ingresa tus credenciales para acceder a tus módulos autorizados.</p>
        </div>

        <!-- Mensaje de Error en credenciales -->
        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show border-0 py-2" role="alert">
            <i class="bi bi-exclamation-octagon-fill me-2"></i>
            <span>Usuario o contraseña incorrectos, o cuenta inactiva.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Mensaje de Cierre de Sesión -->
        <div th:if="${param.logout}" class="alert alert-info alert-dismissible fade show border-0 py-2" role="alert">
            <i class="bi bi-info-circle-fill me-2"></i>
            <span>Has cerrado sesión correctamente.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Formulario de Inicio de Sesión -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold text-dark">Nombre de Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" id="username" name="username" class="form-control border-start-0" placeholder="admin, medico1, recepcion1..." required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold text-dark">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" id="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold shadow-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
            </button>
        </form>

        <!-- Tarjetas de Acceso de Prueba para Evaluación -->
        <div class="mt-4 pt-3 border-top text-center">
            <small class="text-muted d-block mb-2 fw-semibold">Credenciales predeterminadas para evaluación:</small>
            <div class="d-flex flex-wrap justify-content-center gap-1 small">
                <span class="badge bg-light text-dark border">admin / admin123</span>
                <span class="badge bg-light text-dark border">medico1 / medico123</span>
                <span class="badge bg-light text-dark border">recepcion1 / recep123</span>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
