<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorías · Farmacia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="d-flex">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="flex-grow-1 p-5">

        <h1 class="fw-bold text-success-emphasis">Categorías de medicamentos</h1>
        <p class="text-muted mb-4">Clasifica los medicamentos por tipo, por ejemplo analgésicos o antibióticos.</p>

        <div class="card mb-4 border-0 shadow-sm">
            <div class="card-body">
                <form th:action="@{/web/categorias}" method="post" class="row g-3 align-items-end">
                    <div class="col-md-5">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">Descripción</label>
                        <input type="text" name="descripcion" class="form-control">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-success w-100">Registrar</button>
                    </div>
                </form>
            </div>
        </div>

        <table class="table table-hover bg-white rounded shadow-sm overflow-hidden align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Estado</th>

                <!-- Cambio 1: NUEVA CABECERA DE COLUMNA ACCIÓN -->

                <th>Acción</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="categoria : ${categorias}">
                <td th:text="${categoria.id}"></td>
                <td th:text="${categoria.nombre}"></td>
                <td th:text="${categoria.descripcion}"></td>
                <td>
                    <span class="badge rounded-pill"
                          th:classappend="${categoria.estado == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'"
                          th:text="${categoria.estado}">
                    </span>
                </td>
                <!-- Cambio 2: CELDA CON BOTÓN CONMUTADOR (DESACTIVAR/ACTIVAR) -->
                <td>
                    <form th:action="@{/web/categorias/{id}/cambiar-estado(id=${categoria.id})}" method="post" style="display:inline;">
                        <button type="submit"
                                class="btn btn-sm"
                                th:classappend="${categoria.estado == 'ACTIVO'} ? 'btn-outline-danger' : 'btn-outline-success'"
                                th:text="${categoria.estado == 'ACTIVO' ? 'Desactivar' : 'Activar'}">
                        </button>
                    </form>
                </td>
                <!-- ======================================================= -->
            </tr>
            </tbody>
        </table>

    </main>

</div>

</body>
</html>
