<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Emitir Receta Médica · Farmacia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="d-flex">
    <!-- Menú lateral -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="flex-grow-1 p-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold text-success-emphasis">Emitir Receta Médica</h1>
                <p class="text-muted mb-0">RF-FAR-15 / RF-FAR-16: Registro de prescripción clínica con parámetros delimitados.</p>
            </div>
            <a th:href="@{/web/recetas}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Regresar a Bandeja
            </a>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong th:text="${error}"></strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form th:action="@{/web/recetas/guardar}" method="post">

                    <!-- 1. Datos del Paciente -->
                    <h5 class="fw-bold text-primary mb-3"><i class="bi bi-person-fill me-1"></i> Datos del Paciente</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">DNI (8 dígitos)</label>
                            <input type="text" name="dniPaciente" class="form-control" required
                                   maxlength="8" minlength="8" pattern="[0-9]{8}" inputmode="numeric"
                                   title="Debe ingresar exactamente 8 dígitos numéricos" placeholder="70891234">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label small fw-semibold">Nombre Completo del Paciente</label>
                            <input type="text" name="nombrePaciente" class="form-control" required
                                   maxlength="80" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ ]{3,80}"
                                   title="Solo letras y espacios (entre 3 y 80 caracteres)" placeholder="Ej. Juan Pérez López">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">N° Historia Clínica (HC-AAAA-NNNN)</label>
                            <input type="text" name="historiaClinica" class="form-control" required
                                   maxlength="15" pattern="HC-[0-9]{4}-[0-9]{4,6}"
                                   title="Formato requerido: HC-AAAA-NNNN (ejemplo: HC-2026-0014)" placeholder="HC-2026-0014">
                        </div>
                    </div>

                    <hr class="my-4">

                    <!-- 2. Datos Médicos y Diagnóstico -->
                    <h5 class="fw-bold text-primary mb-3"><i class="bi bi-heart-pulse-fill me-1"></i> Médico y Consulta</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Médico Prescriptor</label>
                            <input type="text" name="medicoNombre" class="form-control" required
                                   maxlength="80" pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\. ]{3,80}"
                                   title="Nombre válido del médico" placeholder="Dr. Carlos Mendoza">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Colegiatura (CMP-XXXXX)</label>
                            <input type="text" name="medicoColegiatura" class="form-control" required
                                   maxlength="10" pattern="CMP-[0-9]{4,6}"
                                   title="Formato requerido: CMP- seguido de 4 a 6 dígitos (ejemplo: CMP-45812)" placeholder="CMP-45812">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label small fw-semibold">Diagnóstico Clínico</label>
                            <input type="text" name="diagnostico" class="form-control" required
                                   maxlength="150" placeholder="Faringitis aguda / Síndrome febril">
                        </div>
                    </div>

                    <hr class="my-4">

                    <!-- 3. Detalle de Fármacos y Posología -->
                    <h5 class="fw-bold text-primary mb-3"><i class="bi bi-capsule me-1"></i> Prescripción Farmacológica</h5>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Medicamento</label>
                            <select name="medicamentoId" class="form-select" required>
                                <option value="" disabled selected>Seleccione un medicamento...</option>
                                <option th:each="med : ${medicamentos}"
                                        th:value="${med.id}"
                                        th:text="${med.codigo + ' - ' + med.nombre + ' (' + (med.presentacion != null ? med.presentacion.nombre : '-') + ')'}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Dosis</label>
                            <input type="text" name="dosis" class="form-control" required
                                   maxlength="40" placeholder="Ej. 1 tableta (500mg)">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Frecuencia</label>
                            <select name="frecuencia" class="form-select" required>
                                <option value="" disabled selected>Seleccione frecuencia...</option>
                                <option value="Cada 4 horas">Cada 4 horas</option>
                                <option value="Cada 6 horas">Cada 6 horas</option>
                                <option value="Cada 8 horas">Cada 8 horas</option>
                                <option value="Cada 12 horas">Cada 12 horas</option>
                                <option value="Cada 24 horas (1 vez al día)">Cada 24 horas (1 vez al día)</option>
                                <option value="Condicional a dolor o fiebre">Condicional a dolor o fiebre</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Duración del Tratamiento</label>
                            <select name="duracion" class="form-select" required>
                                <option value="" disabled selected>Seleccione duración...</option>
                                <option value="Dosis única">Dosis única</option>
                                <option value="3 días">3 días</option>
                                <option value="5 días">5 días</option>
                                <option value="7 días">7 días</option>
                                <option value="10 días">10 días</option>
                                <option value="15 días">15 días</option>
                                <option value="30 días">30 días</option>
                                <option value="Tratamiento continuo">Tratamiento continuo</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Vía de Administración</label>
                            <select name="via" class="form-select" required>
                                <option value="Oral" selected>Oral</option>
                                <option value="Intravenosa">Intravenosa</option>
                                <option value="Intramuscular">Intramuscular</option>
                                <option value="Tópica">Tópica</option>
                                <option value="Oftálmica">Oftálmica</option>
                                <option value="Inhalatoria">Inhalatoria</option>
                                <option value="Sublingual">Sublingual</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Cantidad Total (Uds)</label>
                            <input type="number" name="cantidad" min="1" max="120" class="form-control" required placeholder="Ej. 15">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Indicaciones Clínicas Adicionales</label>
                        <textarea name="indicaciones" class="form-control" maxlength="255" rows="2" placeholder="Tomar después de las comidas con abundante agua."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/web/recetas}" class="btn btn-light">Cancelar</a>
                        <button type="submit" class="btn btn-success px-4 fw-bold">
                            <i class="bi bi-check-circle me-1"></i> Emitir Prescripción
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
