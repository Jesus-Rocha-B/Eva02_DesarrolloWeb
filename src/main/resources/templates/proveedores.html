<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Proveedores · Farmacia</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="d-flex">

    <!-- Barra lateral compartida -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Contenido principal -->
    <main class="flex-grow-1 p-5">

        <h1 class="fw-bold text-success-emphasis">Gestión de Proveedores</h1>
        <p class="text-muted mb-4">Administración de distribuidores mayoristas y abastecedores de medicamentos.</p>

        <!-- Mensajes flash del servidor -->
        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm" role="alert">
            <strong>Éxito:</strong> <span th:text="${mensajeExito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm" role="alert">
            <strong>Error:</strong> <span th:text="${mensajeError}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>

        <!-- Formulario de Registro de Proveedor -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white fw-bold text-secondary">
                Registrar Nuevo Proveedor
            </div>
            <div class="card-body">
                <form th:action="@{/web/proveedores}" th:object="${nuevoProveedor}" method="post" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">RUC (11 dígitos)</label>
                        <input type="text" th:field="*{ruc}" class="form-control" maxlength="11" minlength="11" placeholder="Ej: 20100055201" required>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label small fw-semibold">Razón Social</label>
                        <input type="text" th:field="*{razonSocial}" class="form-control" placeholder="Ej: Distribuidora Farmacéutica del Centro S.A.C." required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Persona de Contacto</label>
                        <input type="text" th:field="*{contacto}" class="form-control" placeholder="Ej: Carlos Mendoza">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">Teléfono</label>
                        <input type="text" th:field="*{telefono}" class="form-control" placeholder="Ej: (01) 456-7890">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Correo Electrónico</label>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="contacto@distribuidora.com">
                    </div>
                    <div class="col-md-5">
                        <label class="form-label small fw-semibold">Dirección</label>
                        <input type="text" th:field="*{direccion}" class="form-control" placeholder="Ej: Av. Industrial 1234, Lima">
                    </div>
                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-success px-4">Guardar Proveedor</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de Proveedores Registrados -->
        <div class="card border-0 shadow-sm overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>RUC</th>
                        <th>Razón Social</th>
                        <th>Contacto</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${proveedores}">
                        <td><code class="text-dark fw-bold" th:text="${p.ruc}"></code></td>
                        <td class="fw-semibold" th:text="${p.razonSocial}"></td>
                        <td class="small text-muted" th:text="${p.contacto != null and !p.contacto.isEmpty() ? p.contacto : '-'}"></td>
                        <td class="small" th:text="${p.telefono != null and !p.telefono.isEmpty() ? p.telefono : '-'}"></td>
                        <td class="small" th:text="${p.email != null and !p.email.isEmpty() ? p.email : '-'}"></td>
                        <td>
                            <span class="badge rounded-pill"
                                  th:classappend="${p.estado == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${p.estado}">
                            </span>
                        </td>
                        <td class="text-center">
                            <form th:action="@{/web/proveedores/{id}/cambiar-estado(id=${p.id})}" method="post" style="display:inline;">
                                <button type="submit"
                                        class="btn btn-sm"
                                        th:classappend="${p.estado == 'ACTIVO'} ? 'btn-outline-danger' : 'btn-outline-success'"
                                        th:text="${p.estado == 'ACTIVO' ? 'Desactivar' : 'Activar'}">
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(proveedores)}">
                        <td colspan="7" class="text-center text-muted py-4">No hay proveedores registrados en el catálogo.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
