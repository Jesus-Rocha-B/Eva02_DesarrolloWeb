<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="sidebar" class="bg-success bg-gradient text-white p-3 d-flex flex-column" style="min-height: 100vh; width: 250px;">
    <!-- Encabezado del Sistema -->
    <div class="d-flex align-items-center gap-2 mb-4 px-2">
        <span class="badge rounded-circle bg-white text-success p-2 fs-6">+</span>
        <span class="fs-4 fw-bold">Farmacia</span>
    </div>

    <!-- Navegación Dinámica según el Rol Autenticado -->
    <nav class="nav nav-pills flex-column gap-1 flex-grow-1">

        <!-- Módulo exclusivo de ADMINISTRADOR -->
        <div sec:authorize="hasRole('ADMINISTRADOR')">
            <small class="text-white-50 text-uppercase fw-semibold px-2 mb-1 d-block">Seguridad & Usuarios</small>
            <a th:href="@{/web/usuarios}" class="nav-link text-white">Usuarios</a>
            <a th:href="@{/web/roles}" class="nav-link text-white">Roles</a>
            <a th:href="@{/web/auditoria}" class="nav-link text-white">Auditoría AOP</a>
            <hr class="border-white opacity-25 my-2">
        </div>

        <!-- Módulo de Negocio de Farmacia (ADMINISTRADOR y RECEPCIONISTA) -->
        <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'RECEPCIONISTA')">
            <small class="text-white-50 text-uppercase fw-semibold px-2 mb-1 d-block">Gestión de Farmacia</small>
            <a th:href="@{/web/categorias}" class="nav-link text-white">Categorías</a>
            <a th:href="@{/web/presentaciones}" class="nav-link text-white">Presentaciones</a>
            <a th:href="@{/web/medicamentos}" class="nav-link text-white">Medicamentos</a>
            <a th:href="@{/web/lotes}" class="nav-link text-white">Stock / Lotes</a>
            <a th:href="@{/web/kardex}" class="nav-link text-white">Kardex / Auditoría</a>
            <a th:href="@{/web/proveedores}" class="nav-link text-white">Proveedores</a>
            <a th:href="@{/web/farmacia/dashboard}" class="nav-link text-white">Dashboard</a>
        </div>

        <!-- Módulo de Prescripción Médica (ADMINISTRADOR y MEDICO) -->
        <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'MEDICO')">
            <hr class="border-white opacity-25 my-2" sec:authorize="hasRole('ADMINISTRADOR')">
            <small class="text-white-50 text-uppercase fw-semibold px-2 mb-1 d-block">Área Médica</small>
            <a th:href="@{/web/recetas}" class="nav-link text-white">Recetas Médicas</a>
        </div>
    </nav>

    <!-- Información de Sesión y Botón de Logout -->
    <div class="pt-3 border-top border-white border-opacity-25 mt-auto">
        <div class="px-2 mb-2 small">
            <div class="text-white-50">Conectado como:</div>
            <div class="fw-bold text-white text-truncate" sec:authentication="name">usuario</div>
            <span class="badge bg-white text-success mt-1" sec:authentication="principal.authorities[0]">ROL</span>
        </div>
        <form th:action="@{/logout}" method="post" class="w-100">
            <button type="submit" class="btn btn-outline-light btn-sm w-100 mt-1">
                Cerrar Sesión
            </button>
        </form>
    </div>
</div>
</body>
</html>
