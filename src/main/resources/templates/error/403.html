<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Denegado (403) · Sistema Clínico</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="container text-center py-5">
    <div class="card border-0 shadow-sm mx-auto p-5" style="max-width: 540px; border-radius: 1rem;">
        <div class="text-danger mb-3">
            <i class="bi bi-shield-lock-fill display-1"></i>
        </div>
        <h1 class="fw-bold text-dark mb-2">Acceso Denegado</h1>
        <p class="badge bg-danger-subtle text-danger fs-6 px-3 py-2 d-inline-block mx-auto mb-3">Error 403 · Prohibido</p>
        <p class="text-muted mb-4">
            Lo sentimos, tu rol de usuario actual no cuenta con los privilegios o permisos necesarios para acceder a este módulo del sistema.
        </p>

        <div class="bg-light p-3 rounded mb-4 text-start small">
            <div><strong>Usuario:</strong> <span sec:authentication="name">usuario</span></div>
            <div><strong>Roles activos:</strong> <span sec:authentication="principal.authorities">[ROLE_...]</span></div>
        </div>

        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/login}" class="btn btn-outline-secondary px-4">
                <i class="bi bi-arrow-left me-1"></i> Ir a Inicio
            </a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-danger px-4">
                    <i class="bi bi-box-arrow-right me-1"></i> Cambiar de Cuenta
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
